<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Denoiser Shootout</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--ink:#eee;--muted:#8b93a7;--accent:#5ad8a4;--warn:#f5b342;--line:#2a2f3a}
  body{font:15px system-ui;background:var(--bg);color:var(--ink);max-width:960px;margin:32px auto;padding:0 16px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  button{font:inherit;padding:10px 22px;border:0;border-radius:8px;background:#e33;color:#fff;cursor:pointer}
  button.on{background:#444}
  button:disabled{opacity:.5;cursor:default}
  label{color:var(--muted);margin-left:14px}
  select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  .top{background:var(--card);border-radius:12px;padding:14px 18px;margin:18px 0;display:flex;gap:24px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .top b{display:block;color:var(--ink);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  #meter{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  #meter div{height:100%;width:0;background:var(--accent);transition:width .05s}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{background:var(--card);border-radius:12px;padding:14px 16px;position:relative}
  .card h2{font-size:15px;font-weight:600;margin:0 0 2px;display:flex;justify-content:space-between;align-items:baseline}
  .card h2 small{color:var(--muted);font-weight:400;font-size:12px}
  .card h2>span{white-space:nowrap}
  .card .big{font-size:40px;font-weight:700;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
  .card .big small{font-size:14px;color:var(--ink);font-weight:500;margin-left:6px}
  .card .row{display:flex;gap:16px;color:var(--muted);font-size:12px;margin:8px 0 6px}
  .card .row b{display:block;color:var(--ink);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .strip{height:36px;display:flex;align-items:flex-end;gap:1px;border-bottom:1px solid var(--line);overflow:hidden}
  .strip span{flex:0 0 3px;background:var(--accent);min-height:1px;border-radius:1px 1px 0 0}
  .strip span.slow{background:var(--warn)}
  .scale{color:var(--muted);font-size:11px;text-align:right;margin-top:2px}
  .rank{font-size:11px;color:var(--muted);background:var(--line);padding:2px 7px;border-radius:10px;font-weight:600;margin-left:8px}
  .rank.first{color:var(--bg);background:var(--accent)}
  audio{width:100%;margin-top:8px;display:block;height:36px}
  audio[hidden]{display:none}
  a{color:var(--accent);font-size:12px}
  section{margin:14px 0;color:var(--muted)}
</style>
<h1>Noise-suppression shootout</h1>
<p class="lead">One mic recording, streamed live through every model in 0.5 s chunks. Cards sort by speed; listen to each result after you stop.</p>
<button id="rec" disabled>Connecting…</button>
<label>mic rate <select id="sr"><option value="8000">8 kHz</option><option value="16000">16 kHz</option><option value="48000" selected>48 kHz</option></select></label>
<label>live monitor (headphones) <select id="mon"><option value="">off</option></select></label>
<span id="status" style="margin-left:12px;color:var(--muted)"></span>

<div class="top">
  <div>Captured<b id="dur">0.0 s</b></div>
  <div>Chunks<b id="chunks">0</b></div>
  <div>All models / chunk<b id="total">– ms</b></div>
  <div>Budget<b>500 ms</b></div>
  <div id="meter"><div></div></div>
</div>

<div class="grid" id="grid"></div>

<section>Noisy (raw mic)<audio id="noisy" controls></audio></section>

<script>
const $ = id => document.getElementById(id);
const BUDGET = 500;  // wall-clock ms available per 0.5 s chunk before a model falls behind live
let ws, actx, pctx, stream, node, noisy = [], samples = 0, chunks = 0, recording = false, header = null, nextPlay = 0;
let M = {};  // model name -> stats + output chunks; cards are created as the server announces models

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("rec").disabled = false; $("rec").textContent = "Record"; $("status").textContent = ""; };
  ws.onclose = () => { $("rec").disabled = true; $("status").textContent = "disconnected, retrying…"; setTimeout(connect, 1000); };
  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) { onChunk(header, new Float32Array(e.data)); return; }
    const m = JSON.parse(e.data);
    if (m.model) header = m;
    if (m.done) finish();
  };
}
connect();

function card(name, msr) {
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML = `<h2>${name}<span><small>${msr / 1000} kHz</small><span class="rank"></span></span></h2>
    <div class="big"><span class="speed">–</span><small>× realtime</small></div>
    <div class="row"><div>avg / chunk<b class="avg">–</b></div><div>last<b class="last">–</b></div><div>filtered<b class="fdur">0.0 s</b></div></div>
    <div class="strip"></div><div class="scale"></div>
    <audio controls hidden></audio><a hidden download="${name}.wav">download wav</a>`;
  $("grid").appendChild(el);
  $("mon").insertAdjacentHTML("beforeend", `<option value="${name}">${name}</option>`);
  return { el, clean: [], fsamples: 0, n: 0, ms: 0, sec: 0, maxMs: 30 };
}

function onChunk(h, x) {
  const m = M[h.model] || (M[h.model] = card(h.model, h.model_sr));
  m.clean.push(x); m.fsamples += x.length; m.n++; m.ms += h.ms; m.sec += h.sec; m.last = h.ms;
  const q = s => m.el.querySelector(s);
  q(".speed").textContent = (m.sec * 1000 / m.ms).toFixed(0);
  q(".avg").textContent = Math.round(m.ms / m.n) + " ms"; q(".last").textContent = h.ms + " ms";
  q(".fdur").textContent = (m.fsamples / actx.sampleRate).toFixed(1) + " s";
  m.maxMs = Math.max(m.maxMs, h.ms * 1.25);
  const bar = document.createElement("span"); bar.dataset.ms = h.ms; bar.title = `${h.ms} ms`;
  if (h.ms > BUDGET) bar.classList.add("slow");
  const strip = q(".strip"); strip.appendChild(bar);
  while (strip.children.length > 90) strip.firstChild.remove();
  for (const s of strip.children) s.style.height = Math.min(100, 100 * s.dataset.ms / m.maxMs) + "%";
  q(".scale").textContent = `0–${Math.round(m.maxMs)} ms per 0.5 s chunk`;
  if ($("mon").value === h.model && pctx) {  // live monitor: schedule this model's output back-to-back
    const b = pctx.createBuffer(1, x.length, actx.sampleRate); b.copyToChannel(x, 0);
    const s = pctx.createBufferSource(); s.buffer = b; s.connect(pctx.destination);
    nextPlay = Math.max(nextPlay, pctx.currentTime + 0.05); s.start(nextPlay); nextPlay += b.duration;
  }
  // totals + rank once every model has reported this chunk
  const all = Object.values(M);
  if (all.every(v => v.n === m.n)) {
    chunks = m.n; $("chunks").textContent = chunks;
    $("total").textContent = all.reduce((a, v) => a + v.last, 0) + " ms";
    all.sort((a, b) => a.ms / a.n - b.ms / b.n).forEach((v, i) => {
      $("grid").appendChild(v.el);
      const r = v.el.querySelector(".rank"); r.textContent = i === 0 ? "fastest" : `#${i + 1}`; r.classList.toggle("first", i === 0);
    });
  }
}

async function start() {
  noisy = []; samples = chunks = 0; M = {}; nextPlay = 0; $("grid").innerHTML = ""; $("chunks").textContent = 0; $("total").textContent = "– ms";
  $("mon").innerHTML = '<option value="">off</option>'; $("noisy").removeAttribute("src");
  const sr = +$("sr").value;  // every model resamples from/to this rate server-side
  actx = new AudioContext({ sampleRate: sr }); pctx = new AudioContext({ sampleRate: sr });
  $("sr").disabled = true;
  ws.send(JSON.stringify({ sr: actx.sampleRate }));
  // turn off browser DSP so the models get the real noise
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const src = actx.createMediaStreamSource(stream);
  node = actx.createScriptProcessor(4096, 1, 1);  // ponytail: deprecated but zero extra files; AudioWorklet if it glitches
  node.onaudioprocess = e => {
    const x = new Float32Array(e.inputBuffer.getChannelData(0));
    noisy.push(x); samples += x.length; ws.send(x.buffer);
    $("dur").textContent = (samples / actx.sampleRate).toFixed(1) + " s";
    let s = 0; for (const v of x) s += v * v;
    $("meter").firstElementChild.style.width = Math.min(100, Math.sqrt(s / x.length) * 400) + "%";
  };
  const mute = actx.createGain(); mute.gain.value = 0;
  src.connect(node).connect(mute).connect(actx.destination);
  recording = true; $("rec").textContent = "Stop"; $("rec").classList.add("on"); $("status").textContent = "recording…";
}

function stop() {
  recording = false; node.disconnect(); stream.getTracks().forEach(t => t.stop()); actx.close();
  ws.send(JSON.stringify({ stop: true }));
  $("rec").disabled = true; $("status").textContent = "finishing…";
  $("meter").firstElementChild.style.width = 0;
}

function finish() {
  setTimeout(() => pctx.close(), 1000);
  $("noisy").src = wavUrl(noisy, actx.sampleRate);
  for (const m of Object.values(M)) {
    const url = wavUrl(m.clean, actx.sampleRate), a = m.el.querySelector("audio"), d = m.el.querySelector("a");
    a.src = url; a.hidden = false; d.href = url; d.hidden = false;
  }
  $("rec").disabled = false; $("sr").disabled = false; $("rec").textContent = "Record"; $("rec").classList.remove("on"); $("status").textContent = "done";
}

$("rec").onclick = () => recording ? stop() : start().catch(e => { $("status").textContent = e.message; });

function wavUrl(chunks, sr) {
  const n = chunks.reduce((a, c) => a + c.length, 0);
  const b = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); b.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt ");
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, sr, true); b.setUint32(28, sr * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true);
  str(36, "data"); b.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of chunks) for (const v of c) { b.setInt16(o, Math.max(-1, Math.min(1, v)) * 32767, true); o += 2; }
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
</script>
